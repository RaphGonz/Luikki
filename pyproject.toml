[project]
name = "comiccolor"
version = "0.1.0"
description = "Layered colour-flatting pipeline for comic and manga production"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
comiccolor = "comiccolor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
