[project]
name = "luikki"
dynamic = ["version"]
description = "Layered colour-flatting pipeline for comic and manga production"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "pillow>=11.0",
    "scikit-image>=0.26",
    "psd-tools>=1.18",
    # Speech-bubble detection. Deliberately onnxruntime and not ultralytics:
    # every YOLO-based comic bubble detector needs an AGPL-3.0 package to
    # run, whatever licence its own weights carry.
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28", "pyjwt[crypto]>=2.8"]
# httpx: `--proposer remote` talks to the GPU endpoint through it.
# platformdirs: where the project lives when `serve` is given no --workdir.
# keyring: the signed-in session, in the system's password store.
web = ["fastapi>=0.141", "uvicorn[standard]>=0.52", "python-multipart>=0.0.32", "httpx>=0.28", "platformdirs>=4", "keyring>=25"]
# Only to build models/manga_line.onnx from erika.pth (`luikki models`), once.
models = ["torch", "onnx>=1.17", "onnxscript>=0.2"]
desktop = ["luikki[web]", "pywebview>=6.2"]
# Deploys `luikki.cloud.modal_app`. Not needed to run the app.
cloud = ["modal>=1.5", "httpx>=0.28", "pyjwt[crypto]>=2.8"]

[project.scripts]
luikki = "luikki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# One version, in `luikki/__init__.py`: the release build checks the tag against it.
version = {attr = "luikki.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `pytest tests` on a clean checkout is nine collection
# errors (`ModuleNotFoundError: No module named 'luikki'`) — the suite
# passed only with an editable install or PYTHONPATH=src set by hand,
# neither of which was written down anywhere.
pythonpath = ["src"]
