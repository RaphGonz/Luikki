<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicColor</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<aside>
  <h1>ComicColor <span id="proposer" class="badge"></span></h1>

  <ol class="steps">
    <li>
      <label class="btn" for="page-file">1 &middot; Upload page</label>
      <input id="page-file" type="file" accept="image/*" hidden>
      <p class="note" id="page-note">No page loaded.</p>
    </li>
    <li>
      <button class="btn" id="btn-panels" data-needs="page">2 &middot; Detect panels</button>
      <p class="note" id="panels-note"></p>
    </li>
    <li>
      <button class="btn" id="btn-bubbles" data-needs="panels">3 &middot; Detect bubbles</button>
      <p class="note" id="bubbles-note"></p>
    </li>
    <li>
      <fieldset class="view edit" id="edit-mode" hidden>
        <legend>Correct</legend>
        <label><input type="radio" name="layer" id="layer-panels" value="panels"> panel corners</label>
        <label><input type="radio" name="layer" id="layer-bubbles" value="bubbles"> bubble corners</label>
        <p class="note" id="edit-note"></p>
      </fieldset>
    </li>
    <li>
      <button class="btn" id="btn-zones" data-needs="panels">4 &middot; Segment zones</button>
      <p class="note" id="zones-note"></p>
    </li>
    <li>
      <label class="btn subtle" for="ref-file">Add reference <span class="opt">optional</span></label>
      <input id="ref-file" type="file" accept="image/*" hidden>
      <select id="ref-kind" class="kind" title="What kind of image this is">
        <option value="sheet">character sheet / swatch</option>
        <option value="page">finished coloured page</option>
        <option value="panel">finished coloured panel</option>
      </select>
      <p class="note" id="ref-note">No palette &mdash; every zone gets its own colour.</p>
      <div id="refs" class="refs"></div>
      <div id="palette" class="palette"></div>
    </li>
    <li>
      <button class="btn" id="btn-flats" data-needs="zones">5 &middot; Generate flats</button>
      <p class="note" id="flats-note"></p>
    </li>
    <li>
      <button class="btn" id="btn-snap-all" data-needs="flats">6 &middot; Snap all</button>
      <label class="thresh">
        within &Delta;E
        <input id="snap-threshold" type="number" min="0" step="0.5" value="12">
      </label>
      <label class="thresh"><input type="checkbox" id="snap-any"> ignore the guard</label>
      <p class="note" id="snap-note">Nothing to snap until the flats exist.</p>
    </li>
    <li>
      <button class="btn primary" id="btn-export" data-needs="flats">7 &middot; Export PSD</button>
      <p class="note">Flats only. Drop your own line layer on top.</p>
    </li>
  </ol>

  <fieldset class="view">
    <legend>Show</legend>
    <label><input type="checkbox" id="v-page" checked> line art</label>
    <label><input type="checkbox" id="v-lines"> extracted lines</label>
    <label><input type="checkbox" id="v-panels" checked> panels</label>
    <label><input type="checkbox" id="v-bubbles" checked> bubbles</label>
    <label><input type="checkbox" id="v-zones" checked> zones</label>
    <label><input type="checkbox" id="v-flats" checked> flats</label>
    <label><input type="checkbox" id="v-left"> left to snap</label>
  </fieldset>

  <button class="btn subtle" id="btn-reset">Start over</button>
</aside>

<main>
  <canvas id="stage"></canvas>

  <section id="inspector" class="inspector" hidden>
    <header>
      <span id="ins-title"></span>
      <button class="x" id="ins-close" title="Close (Esc)">&times;</button>
    </header>
    <p class="note" id="ins-area"></p>

    <p class="ins-row">
      <i id="ins-current"></i>
      <span id="ins-current-label"></span>
    </p>
    <p class="ins-row" id="ins-suggestion-row">
      <i id="ins-suggestion"></i>
      <span id="ins-suggestion-label"></span>
    </p>

    <button class="btn" id="ins-snap">Snap to suggestion</button>
    <button class="btn subtle" id="ins-unsnap">Put back what the model proposed</button>

    <p class="note" id="ins-pick-note">Or pick a reference colour:</p>
    <div id="ins-palette" class="palette pick"></div>
  </section>

  <div id="menu" class="menu" hidden></div>
  <div id="status" class="status"></div>
</main>

<script src="/app.js"></script>
</body>
</html>
