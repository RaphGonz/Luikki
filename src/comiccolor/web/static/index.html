<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicColor</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<aside>
  <h1>ComicColor <span id="proposer" class="badge"></span></h1>

  <ol class="steps">
    <li>
      <label class="btn" for="page-file">1 &middot; Upload page</label>
      <input id="page-file" type="file" accept="image/*" hidden>
      <p class="note" id="page-note">No page loaded.</p>
    </li>
    <li>
      <button class="btn" id="btn-panels" data-needs="page">2 &middot; Detect panels</button>
      <p class="note" id="panels-note"></p>
    </li>
    <li>
      <button class="btn" id="btn-bubbles" data-needs="page">3 &middot; Detect bubbles</button>
      <p class="note" id="bubbles-note"></p>
    </li>
    <li>
      <button class="btn" id="btn-zones" data-needs="panels">4 &middot; Segment zones</button>
      <p class="note" id="zones-note"></p>
    </li>
    <li>
      <label class="btn subtle" for="ref-file">Character sheet / swatch <span class="opt">optional</span></label>
      <input id="ref-file" type="file" accept="image/*" hidden>
      <p class="note" id="ref-note">No palette &mdash; every zone gets its own colour.</p>
      <div id="palette" class="palette"></div>
    </li>
    <li>
      <button class="btn" id="btn-flats" data-needs="zones">5 &middot; Generate flats</button>
      <p class="note" id="flats-note"></p>
    </li>
    <li>
      <button class="btn primary" id="btn-export" data-needs="flats">6 &middot; Export PSD</button>
      <p class="note">Flats only. Drop your own line layer on top.</p>
    </li>
  </ol>

  <fieldset class="view">
    <legend>Show</legend>
    <label><input type="checkbox" id="v-page" checked> page</label>
    <label><input type="checkbox" id="v-lines"> extracted lines</label>
    <label><input type="checkbox" id="v-panels" checked> panels</label>
    <label><input type="checkbox" id="v-bubbles" checked> bubbles</label>
    <label><input type="checkbox" id="v-zones" checked> zones</label>
    <label><input type="checkbox" id="v-flats" checked> flats</label>
  </fieldset>

  <button class="btn subtle" id="btn-reset">Start over</button>
</aside>

<main>
  <canvas id="stage"></canvas>
  <div id="status" class="status"></div>
</main>

<script src="/app.js"></script>
</body>
</html>
