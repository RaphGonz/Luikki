<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luikki</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- No word the artist reads is written here: every one is a key into
     locales/<lang>.json, filled in by app.js. The one exception is the name,
     which is a name. -->

<div class="shell" id="shell">

  <header class="header">
    <svg class="logo" viewBox="84 54 2954 2349" aria-hidden="true">
      <path d="M1254 54L2763 1556L2717 1579C2506 1422 2182 1460 2001 1652L1246 2391L84 1220Z"/>
      <circle cx="2694.5" cy="2052.7" r="344.4"/>
    </svg>
    <span class="brand">Luikki</span>
    <span class="rule" aria-hidden="true"></span>
    <span class="page-name" id="page-name"></span>
    <button class="btn quiet icon" id="toggle-inspector" type="button" aria-pressed="true"
            data-i18n-title="header.inspector" data-i18n-aria-label="header.inspector">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M10 3v10"/></svg>
    </button>
  </header>

  <nav class="rail" data-i18n-aria-label="rail.label">
    <ol class="steps" id="steps"></ol>
    <hr class="separator">
    <ul class="books" id="books"></ul>
  </nav>

  <main class="stage-cell">
    <canvas id="stage" data-i18n-aria-label="stage.label"></canvas>
    <div id="menu" class="menu" role="menu" hidden></div>
  </main>

  <aside class="inspector" data-i18n-aria-label="inspector.label">
    <div class="inspector-body" id="inspector-body"></div>
    <div class="inspector-footer" id="inspector-footer"></div>
  </aside>

  <footer class="footer">
    <div class="progress">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <div class="bar indeterminate" id="bar" role="progressbar" hidden data-i18n-aria-label="footer.progress">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
    </div>
    <div class="toggles">
      <label class="check"><input type="checkbox" id="v-lines"><span data-i18n="toggle.lines"></span></label>
      <label class="check"><input type="checkbox" id="v-neutral"><span data-i18n="toggle.neutral"></span></label>
      <label class="check" id="v-left-label" hidden><input type="checkbox" id="v-left"><span data-i18n="toggle.left"></span></label>
      <span class="zoom" id="zoom"></span>
      <select id="language" hidden data-i18n-aria-label="footer.language"></select>
    </div>
  </footer>

</div>

<input id="page-file" type="file" accept="image/*" hidden>
<input id="ref-file" type="file" accept="image/*" hidden>
<input id="pal-file" type="file" accept="image/*" hidden>

<script src="/app.js"></script>
</body>
</html>
